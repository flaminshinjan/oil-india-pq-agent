app = "oil-india-pq-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CHROMA_DIR = "/app/chroma_db"
  # data_root: corpus location (only relevant if you re-ingest)
  DATA_ROOT = "/app/data"
  # runtime_data_dir: where agents read DB/ Excels + synthetic/ JSON at runtime
  RUNTIME_DATA_DIR = "/app/data"
  EMBED_MODEL = "sentence-transformers/all-MiniLM-L6-v2"
  # Sonnet 4.6 — stronger instruction-following than Haiku for this RAG
  # workload; the draft-reply-vs-PDF and source-tier guardrails hold more
  # reliably on it, at the cost of somewhat slower streaming.
  ANTHROPIC_MODEL = "claude-sonnet-4-6"
  # Haiku powers small parallel helper calls (per-section prose expansion).
  ANTHROPIC_FAST_MODEL = "claude-haiku-4-5-20251001"
  # Reports are DRAFTED by Sonnet — a detailed charted 5-6 page report needs a
  # strong model (Haiku narrated instead of calling the tool, thin output).
  ANTHROPIC_REPORT_MODEL = "claude-sonnet-4-6"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm — the runtime (torch + sentence-transformers
  # + chromadb) needs ~50s to import, so we never want users to hit a cold
  # start. Auto-start is left on so Fly can scale up under load.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

[[http_service.checks]]
  # Generous grace period because cold imports take ~50s. The interval+
  # timeout combo gives the app plenty of room before Fly considers a
  # machine unhealthy and re-creates it.
  interval = "30s"
  timeout = "10s"
  grace_period = "120s"
  method = "GET"
  path = "/api/health"

# The image bakes in the embedding model + Chroma store. Cold start
# memory is ~700MB; give it 2GB headroom to avoid OOM on a tool burst.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
